<script>
// The pinned UMD worker supports classic execution. Chromium cannot start its
// default module/blob worker in an opaque sandbox. Use Mapbox's public workerClass
// hook inside this guest only; never weaken the iframe or replace window.Worker.
if(typeof mapboxgl!=='undefined'&&self.origin==='null'){
 mapboxgl.workerClass=class MapDeskWorker extends Worker{
  constructor(){super(mapboxgl.workerUrl,{type:'classic',name:'mapdesk-mapbox'});}
 };
}

const status=document.getElementById('status');
const hint=document.getElementById('hint');
const box=document.getElementById('box');
const svg=document.getElementById('circle-overlay');
const svgCircle=document.getElementById('circle-shape');
const tooltip=document.getElementById('tooltip');
const coordsBar=document.getElementById('coords');
const legendEl=document.getElementById('legend');
const measureLabel=document.getElementById('measure-label');
const LABEL_FONTS=['DIN Offc Pro Medium','Arial Unicode MS Regular'];
const BASEMAP_STYLE='mapbox://styles/mapbox/dark-v11';
// R1 basemap picker: the Mapbox style is chosen at map construction from init.
const BASEMAPS={dark:'mapbox://styles/mapbox/dark-v11',light:'mapbox://styles/mapbox/light-v11',streets:'mapbox://styles/mapbox/streets-v12',satellite:'mapbox://styles/mapbox/satellite-streets-v12'};
const SKY={'sky-color':'#0b2940','sky-horizon-blend':0.6,'horizon-color':'#3a5a75','horizon-fog-blend':0.5,'fog-color':'#6f8ba3','fog-ground-blend':0.6,'atmosphere-blend':['interpolate',['linear'],['zoom'],0,1,10,1,12,0]};

let GL=null,map=null,channel=null,loaded=false,state=null,syncing=false,activeLayer=null,popup=null;
let mode='select',renderedOnce=false,pngPending=null,orderKey=null,mapdeskDataLayerIds=[];
let basemap='dark',bootBasemap='dark',pendingStyle=false,terrainOn=false,heatOn=false,clusterOn=false,pendingFit=null,hovered=null;
const measure={coords:[],finished:false};
const geoCache=new Map(); // layer.id -> {revision, geojson}; slim layers reuse cached geojson
const drawn=new Map(); // layer.id -> {data, fc, points, classes}: what the map source currently holds
const heatIds=new Set(); // heatmap layer ids this guest added
let bootView=null,lastView=''; // camera to boot with; last camera reported to the pane
function viewKey(center,zoom){return (+center[0]).toFixed(6)+','+(+center[1]).toFixed(6)+','+(+zoom).toFixed(4);}
function classified(layer,memo){
 // Classes depend only on the layer body and its style; a state push that
 // changes neither (selection, visibility, another layer) reuses them.
 const key=JSON.stringify(layer.style||{});
 let cls=memo.classes.get(key);
 if(!cls){if(memo.classes.size>8)memo.classes.clear();cls=classifyLayer(layer,memo.fc.features);memo.classes.set(key,cls);}
 return cls;
}
function emit(type,payload={}){parent.postMessage({version:1,type,channel,...payload},'*');}
function originalFeatureId(layer,index){return layer?.geojson?.features[index]?.id;}
function message(text){status.textContent=text;status.style.display='flex';}
function setHint(){hint.textContent=mode==='measure'?'Measure: click to add vertices · Double-click or Enter to finish · Esc clears':'Click to inspect · Shift-drag box select · Ctrl-drag radius select · Measure mode in the pane header';liftScale();}
function liftScale(){
 // Keep the scale bar clear of the hint box. On Mapbox the logo sits under the
 // scale bar and pushes it up into the hint; measured, so a wrapped hint or a
 // different control stack is handled the same way.
 const scale=document.querySelector('.mapboxgl-ctrl-scale,.maplibregl-ctrl-scale');
 if(!scale)return;
 scale.style.marginBottom='';
 const a=scale.getBoundingClientRect(),b=hint.getBoundingClientRect();
 if(!a.width||!b.width||a.right<=b.left||a.left>=b.right||a.bottom<=b.top-2||a.top>=b.bottom+2)return;
 scale.style.marginBottom=((parseFloat(getComputedStyle(scale).marginBottom)||0)+a.bottom-b.top+4)+'px';
}
function setCircle(cx,cy,r){svgCircle.setAttribute('cx',String(cx));svgCircle.setAttribute('cy',String(cy));svgCircle.setAttribute('r',String(r));}
function hasLabelField(layer,features){const name=layer.style?.label_field;if(!name)return false;if(Array.isArray(layer.fields))return layer.fields.includes(name);return features.some(f=>f.properties&&Object.prototype.hasOwnProperty.call(f.properties,name));}
function exportPng(scale){
 // R1: a 2x snapshot is attempted ONLY where the map exposes setPixelRatio
 // (guarded); otherwise the existing 1x path is kept unchanged.
 try{
  if(scale===2&&typeof map.setPixelRatio==='function'){
   const prev=typeof map.getPixelRatio==='function'?map.getPixelRatio():(window.devicePixelRatio||1);
   map.setPixelRatio((window.devicePixelRatio||1)*2);
   map.once('render',()=>{let dataUrl=null;try{dataUrl=map.getCanvas().toDataURL('image/png');}catch(_){}map.setPixelRatio(prev);if(dataUrl)emit('mapdesk:png',{dataUrl});else emit('mapdesk:error',{message:'PNG export failed'});});
   return;
  }
  // Read the canvas inside a render callback: the frame is still in the
  // drawing buffer there, so no preserveDrawingBuffer is needed (MapLibre 5
  // ignores that option and a later read returns a blank image).
  map.once('render',()=>{try{emit('mapdesk:png',{dataUrl:map.getCanvas().toDataURL('image/png')});}catch(_){emit('mapdesk:error',{message:'PNG export failed'});}});
  map.triggerRepaint();
 }catch(_){emit('mapdesk:error',{message:'PNG export failed'});}
}
function doFit(bbox){
 // R1 mapdesk:fit — the camera stays the single source of truth: fitBounds runs
 // here and the existing moveend write-back persists the resulting camera.
 if(!Array.isArray(bbox)||bbox.length!==4||bbox.some(v=>typeof v!=='number'||!Number.isFinite(v)))return;
 if(!map||!loaded){pendingFit=bbox;return;} // queued until load like other actions
 map.fitBounds([[bbox[0],bbox[1]],[bbox[2],bbox[3]]],{padding:24,maxZoom:16,linear:false});
}
function applyBasemap(){
 if(!map||!loaded||basemap===bootBasemap)return;
 bootBasemap=basemap;
 map.setStyle(BASEMAPS[basemap]||BASEMAP_STYLE,{diff:false});
 map.once('style.load',()=>{
  // Data layers and the legend must survive a basemap swap: reset the draw
  // order key so render() re-adds everything, rebuild the measure chrome
  // and re-apply terrain if it was on.
  orderKey=null;
  hovered=null;
  addMeasureLayers();
  if(terrainOn)applyTerrain();
  render(state||{revision:0,layers:[]});
 });
}
function setBasemap(next){
 if(!BASEMAPS[next])return;
 basemap=next;
 if(!map||!loaded){pendingStyle=true;return;}
 applyBasemap();
}
function setTerrainOn(on){terrainOn=!!on;if(map&&loaded)applyTerrain();}
function applyTerrain(){
 if(!map||!loaded)return;
 if(!terrainOn){map.setTerrain(null);return;}
 if(!map.getSource('mapbox-dem'))map.addSource('mapbox-dem',{type:'raster-dem',url:'mapbox://mapbox.mapbox-terrain-dem-v1',tileSize:512,maxzoom:14});
 map.setTerrain({source:'mapbox-dem'});
 // Documented Mapbox GL v3 sky API: a subtle atmosphere matching the chrome.
 if(typeof map.setSky==='function')map.setSky(SKY);
}
function setHeatmap(on){heatOn=!!on;if(map&&loaded)updateHeatmap();}
function setClustering(on){
 clusterOn=!!on;
 if(!map||!loaded)return;
 // Clustering cannot be flipped on a live source: drop the mapdesk layers and
 // data sources and re-render from the geojson cache (cache keys stay intact).
 clearHover();
 for(const l of [...map.getStyle().layers])if(l.metadata?.mapdesk)map.removeLayer(l.id);
 for(const id of Object.keys(map.getStyle().sources))if(id.startsWith('data-'))map.removeSource(id);
 orderKey=null;
 hovered=null;
 render(state||{revision:0,layers:[]});
}
// Hover state is REMOVED when it ends, never set to false. A source that still carries any feature state
// (even {hover:false}) has its paint buffers refreshed whenever one of its tiles finishes loading. If that
// lands just after the data layers were removed and re-added, Mapbox GL copies the new layer's not yet
// evaluated paint value into the old tile's zoom-and-state binder and the next frame throws
// 'this.expression.interpolationFactor is not a function'. With no state left there is nothing to refresh.
function clearHover(){
 if(!hovered)return;
 try{map.removeFeatureState({source:hovered.source,id:hovered.id});}catch(_){/* the source is already gone */}
 hovered=null;
}
function updateHover(f){
 // R1 hover highlight: a feature-state hover flag + pointer cursor; the paint
 // expressions bump line-width/circle-radius via ['feature-state','hover'].
 const next=f&&f.layer&&f.layer.metadata&&f.layer.metadata.mapdesk&&!f.layer.metadata.cluster&&!f.layer.metadata.heat?{source:f.source,id:f.id}:null;
 if(hovered&&!(next&&next.source===hovered.source&&next.id===hovered.id))clearHover();
 if(next&&!hovered){
  try{map.setFeatureState({source:next.source,id:next.id},{hover:true});}catch(_){}
  hovered=next;
 }
 map.getCanvas().style.cursor=next?'pointer':'';
}
function updateHeatmap(){
 // R1 heatmap: one heatmap layer per VISIBLE point-bearing source, inserted
 // below the data layers; all of them are removed when the mode goes off.
 // Runs on every render, so it only touches the map when something differs.
 if(!map||(!heatOn&&!heatIds.size))return;
 const want=new Map();
 if(heatOn&&state)for(const layer of Array.isArray(state.layers)?state.layers:[]){
  if(!layer.visible)continue;
  const data=cachedGeojson(layer,geoCache),memo=drawn.get(layer.id);
  if(!data||!(memo&&memo.data===data?memo.points:hasPointFeatures(data.features)))continue;
  want.set('data-'+layer.id+'-heatmap',layer);
 }
 for(const id of [...heatIds])if(!want.has(id)||!map.getLayer(id)){if(map.getLayer(id))map.removeLayer(id);heatIds.delete(id);}
 for(const [id,layer] of want){
  const st=layerStyle(layer);
  const paint={'heatmap-weight':1,'heatmap-radius':heatmapRadiusExpr(),'heatmap-color':heatmapColorExpr(st.palette),'heatmap-opacity':st.opacity};
  if(map.getLayer(id)){for(const [k,v] of Object.entries(paint))map.setPaintProperty(id,k,v);continue;}
  if(!map.getSource('data-'+layer.id))continue;
  const spec={id,type:'heatmap',source:'data-'+layer.id,metadata:{mapdesk:layer.id,heat:true},paint};
  const before=mapdeskDataLayerIds.find(other=>map.getLayer(other));
  if(before)map.addLayer(spec,before);else map.addLayer(spec);
  heatIds.add(id);
 }
}

// MAPDESK-CORE-BEGIN
// Pure renderer core (no DOM, no map, no library references): classification
// v2, the slim-layer geojson cache resolver and geodesic measure math. This
// block is byte-identical in desktop/map.html and desktop/map_keyless.html;
// tests/test_renderer.py extracts it from both guests, checks parity, and
// runs it under node to verify the behavior below.
const CLASSIC=['#6ed8d0','#e7ad67','#aab1ff','#ef86a4','#8ac887','#f2d37e','#72b8f0','#ba9bce'];
const OKABE=['#0072B2','#E69F00','#009E73','#D55E00','#CC79A7','#56B4E9','#F0E442','#111111'];
const VIRIDIS=['#440154','#46327E','#365C8D','#277F8E','#1FA187','#4AC16B','#A0DA39','#FDE725'];
const SUNSET=['#2C7BB6','#00A6CA','#79D1A4','#C9E892','#F4C46B','#ED8A4C','#D7191C','#7B0D2B'];
const PALETTES={classic:CLASSIC,okabe:OKABE,viridis:VIRIDIS,sunset:SUNSET};
const FALLBACK_COLOR='#88949f';
const LEGACY_RAMP=['#440154','#3b528b','#21918c','#5ec962','#fde725'];
const EARTH_R=6371008.8;
function rampColors(count,ramp){ramp=ramp||LEGACY_RAMP;return Array.from({length:count},(_,i)=>ramp[count===1?2:Math.round(i*(ramp.length-1)/(count-1))]);}
function optNumber(value,defaultValue,low,high){const n=+value;return Number.isFinite(n)?Math.min(high,Math.max(low,n)):defaultValue;}
function layerStyle(layer){const s=(layer&&layer.style)||{};return {color:s.color||CLASSIC[0],opacity:optNumber(s.opacity,0.85,0,1),color_by:s.color_by||null,class_method:s.class_method||'auto',class_count:Math.round(optNumber(s.class_count,5,3,7)),palette:Object.prototype.hasOwnProperty.call(PALETTES,s.palette)?s.palette:'classic',label_field:s.label_field||null,line_width:optNumber(s.line_width,2.2,0.5,8),circle_radius:optNumber(s.circle_radius,5,2,15)};}
function num(value){if(value===null||value===undefined||value===''||typeof value==='boolean')return null;const n=typeof value==='number'?value:+value;return Number.isFinite(n)?n:null;}
function paletteColors(name,count){const p=PALETTES[name]||CLASSIC;count=Math.max(1,Math.floor(count));if(count===1)return [p[0]];if(count>=p.length)return p.slice(0,count);return Array.from({length:count},(_,i)=>p[Math.round(i*(p.length-1)/(count-1))]);}
function uniqueCategories(features,field){return [...new Set(features.map(f=>String(f.properties?.[field]??'')))].sort().slice(0,24);}
function countMatches(features,field,value){let count=0;for(const f of features)if(String(f.properties?.[field]??'')===value)count++;return count;}
function collectNumbers(features,field){const nums=[];let missing=0;for(const f of features){const n=num(f.properties?.[field]);if(n===null)missing++;else nums.push(n);}return {nums,missing};}
function minMax(nums){let lo=Infinity,hi=-Infinity;for(const v of nums){if(v<lo)lo=v;if(v>hi)hi=v;}return [lo,hi];}
function quantileBreaks(values,count){const s=[...values].sort((a,b)=>a-b);const n=s.length;const breaks=[];for(let i=1;i<count;i++){const v=s[Math.min(n-1,Math.floor(i*n/count))];if(!breaks.length||v>breaks[breaks.length-1])breaks.push(v);}return breaks;}
function equalBreaks(values,count){const [lo,hi]=minMax(values);const breaks=[];if(hi<=lo)return breaks;for(let i=1;i<count;i++){const v=lo+(hi-lo)*i/count;if(!breaks.length||v>breaks[breaks.length-1])breaks.push(v);}return breaks;}
function jenksBreaks(values,count){
 // Classic Jenks natural breaks (Fisher/Jenks): the optimal k-class partition
 // of the sorted values minimising total within-class variance, computed with
 // a dynamic program over prefix sums (O(n^2*k)). Callers cap n at 2,000
 // numeric values and fall back to quantile breaks beyond that.
 const data=[...values].sort((a,b)=>a-b);const n=data.length;
 if(n===0)return [];
 const k=Math.max(1,Math.min(Math.round(count),n));
 if(k<2)return [];
 const P=new Float64Array(n+1),Q=new Float64Array(n+1);
 for(let i=0;i<n;i++){P[i+1]=P[i]+data[i];Q[i+1]=Q[i]+data[i]*data[i];}
 const D=[],B=[];
 for(let c=0;c<=k;c++){D[c]=new Float64Array(n).fill(Infinity);B[c]=new Int32Array(n);}
 for(let i=0;i<n;i++)D[1][i]=Q[i+1]-P[i+1]*P[i+1]/(i+1);
 for(let c=2;c<=k;c++){const Dp=D[c-1],Dc=D[c],Bc=B[c];
  for(let i=c-1;i<n;i++){let best=Infinity,bestJ=c-2;
   for(let j=c-2;j<i;j++){const s=P[i+1]-P[j+1],ss=Q[i+1]-Q[j+1],len=i-j,t=Dp[j]+ss-s*s/len;
    if(t<best){best=t;bestJ=j;}}
   Dc[i]=best;Bc[i]=bestJ;}}
 const end=new Int32Array(k+1);end[k]=n-1;
 for(let c=k;c>=2;c--)end[c-1]=B[c][end[c]];
 const breaks=[];
 for(let c=1;c<k;c++){const v=data[end[c]+1];if(!breaks.length||v>breaks[breaks.length-1])breaks.push(v);}
 return breaks;
}
function classCounts(nums,breaks){const counts=new Array(breaks.length+1).fill(0);for(const v of nums){let i=breaks.length-1;while(i>=0&&v<breaks[i])i--;counts[i+1]++;}return counts;}
function fmtNum(value){const n=+value;if(!Number.isFinite(n))return String(value);const abs=Math.abs(n);const text=abs>=100?n.toFixed(0):abs>=1?n.toFixed(2):n.toPrecision(3);return String(+text);}
function methodNote(method,count){if(method==='quantile')return 'Quantile classes, not a continuous ramp.';if(method==='jenks')return 'Natural breaks (Jenks), '+count+' classes.';if(method==='equal')return 'Equal interval classes, '+count+' classes.';return null;}
function withBlank(field,inner){return ['case',['any',['!',['has',field]],['==',['get',field],null],['==',['get',field],'']],FALLBACK_COLOR,inner];}
function blankRow(count){return {label:'(blank)',color:FALLBACK_COLOR,count};}
function legendRows(features,field,breaks,colors){const nums=collectNumbers(features,field).nums;const counts=classCounts(nums,breaks);const rows=[];for(let j=0;j<=breaks.length;j++){const lo=j===0?null:breaks[j-1],hi=j===breaks.length?null:breaks[j];const label=lo===null?'< '+fmtNum(hi):hi===null?'> '+fmtNum(lo):fmtNum(lo)+' – '+fmtNum(hi);rows.push({label,color:colors[j],count:counts[j]});}return rows;}
function classifyUnique(st,features,field){
 const cats=uniqueCategories(features,field);
 const pal=PALETTES[st.palette]||CLASSIC;
 if(!cats.length)return {method:'unique',expression:st.color,legend:null,note:null};
 const expression=['match',['to-string',['get',field]]];
 const rows=[];
 cats.forEach((value,i)=>{const color=pal[i%pal.length];expression.push(value,color);rows.push({label:value===''?'(blank)':value,color,count:countMatches(features,field,value)});});
 expression.push(FALLBACK_COLOR);
 return {method:'unique',expression,legend:{kind:'rows',rows},note:null};
}
function classifyContinuous(st,features,field){
 const {nums,missing}=collectNumbers(features,field);
 if(nums.length===0)return {method:'continuous',expression:FALLBACK_COLOR,legend:{kind:'rows',rows:missing?[blankRow(missing)]:[]},note:null};
 const single=paletteColors(st.palette,1);
 if(nums.length===1)return {method:'continuous',expression:single[0],legend:{kind:'gradient',min:nums[0],max:nums[0],colors:single},note:null};
 const [lo,hi]=minMax(nums);const pal=PALETTES[st.palette]||CLASSIC;
 const expression=['interpolate',['linear'],['to-number',['get',field],0]];const colors=[];
 pal.forEach((color,i)=>{expression.push(lo+(hi-lo)*i/(pal.length-1),color);colors.push(color);});
 return {method:'continuous',expression:withBlank(field,expression),legend:{kind:'gradient',min:lo,max:hi,colors},note:null};
}
function classifySteps(st,features,field,method){
 const {nums,missing}=collectNumbers(features,field);
 if(nums.length===0)return {method,expression:FALLBACK_COLOR,legend:{kind:'rows',rows:missing?[blankRow(missing)]:[]},note:methodNote(method,st.class_count)};
 let breaks;
 if(method==='quantile')breaks=quantileBreaks(nums,st.class_count);
 else if(method==='equal')breaks=equalBreaks(nums,st.class_count);
 else if(nums.length>2000)breaks=quantileBreaks(nums,st.class_count); // Jenks capped at 2,000 numeric values; quantile fallback beyond.
 else breaks=jenksBreaks(nums,st.class_count);
 if(!breaks.length){const [lo,hi]=minMax(nums);const rows=[{label:fmtNum(lo)+' – '+fmtNum(hi),color:paletteColors(st.palette,1)[0],count:nums.length}];if(missing)rows.push(blankRow(missing));return {method,expression:paletteColors(st.palette,1)[0],legend:{kind:'rows',rows},note:methodNote(method,1)};}
 const colors=paletteColors(st.palette,breaks.length+1);
 const step=['step',['to-number',['get',field],0],colors[0]];
 breaks.forEach((value,i)=>step.push(value,colors[i+1]));

   }
  },true);
  window.addEventListener('mousemove',e=>{
   if(start){
    box.style.left=Math.min(start[0],e.clientX)+'px';box.style.top=Math.min(start[1],e.clientY)+'px';
    box.style.width=Math.abs(start[0]-e.clientX)+'px';box.style.height=Math.abs(start[1]-e.clientY)+'px';
   }else if(radiusDrag){
    const dx=e.clientX-radiusDrag.centerPx[0],dy=e.clientY-radiusDrag.centerPx[1];
    setCircle(radiusDrag.centerPx[0],radiusDrag.centerPx[1],Math.hypot(dx,dy));
    const cur=map.unproject([e.clientX,e.clientY]);
    radiusDrag.meters=haversineM(radiusDrag.center,[cur.lng,cur.lat]);
   }
  });
  window.addEventListener('mouseup',e=>{
   if(start){
    const from=start;start=null;box.style.display='none';map.dragPan.enable();
    if(!activeLayer||Math.abs(from[0]-e.clientX)<3||Math.abs(from[1]-e.clientY)<3)return;
    const a=map.unproject(from),b=map.unproject([e.clientX,e.clientY]);
    emit('mapdesk:select',{layer_id:activeLayer,bbox:[Math.min(a.lng,b.lng),Math.min(a.lat,b.lat),Math.max(a.lng,b.lng),Math.max(a.lat,b.lat)]});
    return;
   }
   if(radiusDrag){
    const d=radiusDrag;radiusDrag=null;svg.style.display='none';map.dragPan.enable();
    const px=Math.hypot(e.clientX-d.centerPx[0],e.clientY-d.centerPx[1]);
    if(activeLayer&&px>3&&d.meters>0)emit('mapdesk:select',{layer_id:activeLayer,radius:{center:d.center,meters:d.meters}});
   }
  });
  window.addEventListener('keydown',e=>{
   if(e.key==='Escape'){
    start=null;radiusDrag=null;box.style.display='none';svg.style.display='none';
    map.dragPan.enable();
    if(mode==='measure')clearMeasure();
   }else if(e.key==='Enter'&&mode==='measure')finishMeasure();
  });
 }catch(_){message('Unable to initialize the Mapbox renderer.');emit('mapdesk:error',{message:'Renderer initialization failed'});}
}
window.addEventListener('message',event=>{
 if(event.source !== parent)return;
 const data=event.data;
 if(!data||typeof data!=='object'||data.version!==1)return;
 if(data.type==='mapdesk:init'&&!channel){
  if(typeof data.channel!=='string'||data.channel.length<16)return;
  channel=data.channel;state=data.state;ingest(state);
  if(BASEMAPS[data.basemap])basemap=data.basemap; // R1: the basemap is chosen at map construction
  terrainOn=!!data.terrain;
  boot(data.token);
  return;
 }
 if(data.channel!==channel||!channel)return;
 if(data.type==='mapdesk:state')render(data.state);
 else if(data.type==='mapdesk:mode')setMode(data.mode);
 else if(data.type==='mapdesk:fit')doFit(data.bbox);
 else if(data.type==='mapdesk:style')setBasemap(data.basemap);
 else if(data.type==='mapdesk:terrain')setTerrainOn(!!data.on);
 else if(data.type==='mapdesk:heatmap')setHeatmap(!!data.on);
 else if(data.type==='mapdesk:cluster')setClustering(!!data.on);
 else if(data.type==='mapdesk:export-png'){if(map&&loaded&&renderedOnce)exportPng(data.scale);else pngPending={scale:data.scale};}
 else if(data.type==='mapdesk:token'&&!map)boot(data.token);
});
window.addEventListener('pagehide',()=>{map?.remove();map=null;});
emit('mapdesk:ready');
</script></body></html>
