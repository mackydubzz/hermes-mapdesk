name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "shapely>=2.1,<3" "numpy>=1.26,<3" "pyproj>=3.7,<4" "openpyxl>=3.1,<4" "pyshp>=2.3,<3" "fastapi>=0.115,<1" "httpx>=0.28,<1" "PyYAML>=6,<7"
      - name: Fetch the Hermes source the registration, API and export tests import
        # Pinned to the Hermes commit the plugin was developed against (v0.23.1).
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 3b421578588243f920886e6fe79a6faa87ea026e
          path: hermes-agent-src
      - name: Put it where the tests look (the default Windows install path)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\AppData\Local\hermes" | Out-Null
          Move-Item hermes-agent-src "$env:USERPROFILE\AppData\Local\hermes\hermes-agent"
      - name: Run the Python test suite
        # The runner context exists at step level only; a job-level env that used it made the whole workflow invalid.
        env:
          MAPDESK_TEST_SCRATCH: ${{ runner.temp }}\mapdesk-scratch
        run: python -m unittest discover -s tests -p "test_*.py" -v

  js-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev dependencies
        run: npm --prefix dev ci
      - name: Desktop contract
        run: npm --prefix dev run test:desktop
      - name: Import helpers
        run: npm --prefix dev run test:imports

  dependency-quarantine:
    # Rule 10 nod: prove a fresh resolution still satisfies our pins,
    # frozen to a release date so a supply-chain incident can't ride in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Resolve dependencies with a release quarantine
        run: |
          uv pip compile --python 3.11 --exclude-newer 2026-11-09 - -o /dev/null <<'EOF'
          shapely>=2.1,<3
          numpy>=1.26,<3
          pyproj>=3.7,<4
          openpyxl>=3.1,<4
          pyshp>=2.3,<3
          fastapi>=0.115,<1
          httpx>=0.28,<1
          PyYAML>=6,<7
          EOF
